services:

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: aa-postgres
    environment:
      POSTGRES_DB: aa_db
      POSTGRES_USER: aa_user
      POSTGRES_PASSWORD: aa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aa_user -d aa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Spring Boot Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aa-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aa_db
      DB_USER: aa_user
      DB_PASS: aa_password
      SERVER_PORT: 8080
      DIGIO_BASE_URL: https://ext.digio.in:444
      # Override these via .env file — do NOT commit real credentials
      DIGIO_USERNAME: ${DIGIO_USERNAME}
      DIGIO_PASSWORD: ${DIGIO_PASSWORD}
      DIGIO_TEMPLATE_ID: ${DIGIO_TEMPLATE_ID}
      CORS_ORIGINS: http://localhost:4200
      CONSENT_REDIRECT_URL: http://localhost:4200/consent/callback
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Angular Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aa-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres-data:
