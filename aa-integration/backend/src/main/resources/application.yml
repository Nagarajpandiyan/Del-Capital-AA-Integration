spring:
  application:
    name: aa-integration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aa_db}
    username: ${DB_USER:aa_user}
    password: ${DB_PASS:aa_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.delcapital: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Digio Configuration
digio:
  base-url: ${DIGIO_BASE_URL:https://ext.digio.in:444}
  username: ${DIGIO_USERNAME:ACK25030511375911186LKWJDXERYTXQ}
  password: ${DIGIO_PASSWORD:CGYGOZKNCMHN8I8GSA5HH2DFKRSR732L}
  template-id: ${DIGIO_TEMPLATE_ID:CTMP250909154046573UG2FM8U7NZK36}
  timeout-seconds: 30
  retry-max-attempts: 3
  retry-delay-ms: 1000

# App Configuration
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET:delcapital-aa-secret-key-change-in-production}
    jwt-expiry-hours: 24
  consent:
    expiry-days: 30
    redirect-url: ${CONSENT_REDIRECT_URL:http://localhost:4200/consent/callback}
  data-retention:
    fetch-data-ttl-days: 90
    audit-log-ttl-days: 365
